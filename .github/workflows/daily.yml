name: jp-power-listening-daily
on:
  schedule:
    - cron: '0 2 * * *'    # 每天 10:00 北京时间（UTC+8，GitHub schedule 不可靠，仅作兜底）
    - cron: '30 2 * * *'   # 10:30 冗余兜底
  workflow_dispatch: {}    # 支持手动触发测试

permissions:
  contents: write

concurrency:
  group: jp-power-listening
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      BRIEF_BASE_URL: ${{ secrets.BRIEF_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check today already published (idempotency)
        id: idem
        run: |
          if curl -sf "${BRIEF_BASE_URL}/brief-$(date +%Y%m%d).html" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Today brief already published, skipping business steps."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.idem.outputs.exists != 'true'
        with:
          python-version: '3.12'

      - name: Install Playwright
        if: steps.idem.outputs.exists != 'true'
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Download Google Trends CSV
        if: steps.idem.outputs.exists != 'true'
        run: python scripts/trends_download.py

      - name: Aggregate trends
        if: steps.idem.outputs.exists != 'true'
        run: |
          D=$(date +%Y%m%d)
          mkdir -p output
          python scripts/aggregate_trends.py data/trends_brands_${D}.csv data/trends_categories_${D}.csv > output/trends_${D}.json

      - name: Fetch news
        if: steps.idem.outputs.exists != 'true'
        run: python scripts/news_fetch.py $(date +%Y%m%d)

      - name: Build brief HTML
        if: steps.idem.outputs.exists != 'true'
        run: python scripts/make_brief.py $(date +%Y%m%d)

      - name: Archive data to portal index
        if: steps.idem.outputs.exists != 'true'
        run: python scripts/archive_data.py $(date +%Y%m%d)

      - name: Push to DingTalk
        if: steps.idem.outputs.exists != 'true'
        run: python scripts/dingtalk_push.py $(date +%Y%m%d)

      - name: Publish brief to gh-pages
        if: steps.idem.outputs.exists != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/html
          publish_branch: gh-pages
          keep_files: true
